<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Document Search</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.runtime.js"></script>
</head>
<body class="auth-body">
  <main class="auth-card">
    <img class="auth-logo" src="images/waghete-logo.png" alt="Waghete" />
    <h1>Document Search</h1>
    <p class="muted">Sign in with your company account.</p>

    <form id="login-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />

      <div class="form-actions">
        <button type="submit" id="login-submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign in
        </button>
      </div>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
  <div id="toast-container" hidden></div>
</body>
</html>
