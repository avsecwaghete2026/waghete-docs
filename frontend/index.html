<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Search</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.runtime.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="navbar-brand">Document Search</div>
    <nav class="navbar-tabs" id="tabs">
      <button type="button" class="tab active" data-view="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </button>
      <button type="button" class="tab" data-view="admin" id="admin-tab" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Admin
      </button>
    </nav>
    <div class="navbar-user">
      <span id="user-email" class="muted"></span>
      <span id="user-role" class="badge"></span>
      <button id="logout-btn" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <!-- ============================================================
         SEARCH VIEW (default; visible to all roles)
         ============================================================ -->
    <section id="view-search" class="view active">
      <div class="search-bar">
        <input id="search-q" type="search" placeholder="Search documents…" autocomplete="off" />
        <select id="search-category"><option value="">All categories</option></select>
        <input id="search-tag" type="text" placeholder="Tag (comma-separated, AND-match)" />
        <input id="search-date-from" type="date" />
        <input id="search-date-to" type="date" />
      </div>

      <div class="results-meta">
        <span id="results-count" class="muted"></span>
        <span id="results-loading" class="loading" hidden>Searching…</span>
      </div>

      <table class="results">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Tags</th>
            <th>Uploaded</th>
            <th>By</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon">⌕</div>Type to search.</div></td></tr>
        </tbody>
      </table>
    </section>

    <!-- ============================================================
         DETAIL MODAL (overlay; opens when a row is clicked)
         ============================================================ -->
    <div id="detail-modal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel">
        <button type="button" class="modal-close" data-close aria-label="Close">×</button>
        <aside class="detail-sidebar">
          <div class="detail-sidebar-inner">
            <h2 id="detail-title" class="detail-title">—</h2>
            <dl class="detail-meta">
              <dt>Category</dt>     <dd id="detail-category">—</dd>
              <dt>Tags</dt>         <dd id="detail-tags">—</dd>
              <dt>Uploaded</dt>     <dd id="detail-uploaded">—</dd>
              <dt>By</dt>           <dd id="detail-uploader">—</dd>
              <dt>Type</dt>         <dd id="detail-type">—</dd>
              <dt>Size</dt>         <dd id="detail-size">—</dd>
            </dl>
            <div class="detail-actions">
              <button type="button" id="detail-download" class="icon-btn primary">Download</button>
              <button type="button" id="detail-edit" class="icon-btn" hidden>Edit</button>
              <button type="button" id="detail-delete" class="icon-btn danger" hidden>Delete</button>
            </div>
          </div>
        </aside>
        <section class="detail-preview">
          <div id="detail-preview-host" class="preview-host"></div>
        </section>
      </div>
    </div>

    <!-- ============================================================
         EDIT MODAL (overlay; pre-filled when opened from detail)
         ============================================================ -->
    <div id="edit-modal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel modal-panel-edit">
        <button type="button" class="modal-close" data-close aria-label="Close">×</button>
        <h2 class="edit-modal-title">Edit document</h2>

        <form id="edit-form">
          <input type="hidden" id="edit-id" />

          <label>Title<input type="text" id="edit-title" required /></label>

          <label>Category
            <div class="cat-selector" id="edit-cat-selector">
              <button type="button" class="cat-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="cat-trigger-label">—</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="cat-dropdown" role="listbox" hidden>
                <div class="cat-options"></div>
                <div class="cat-add-row">
                  <button type="button" class="cat-add-btn">+ New category</button>
                  <input type="text" class="cat-add-input" placeholder="Category name" hidden />
                </div>
              </div>
            </div>
            <input type="hidden" id="edit-category" value="" />
          </label>

          <label>Tags (comma-separated)<input type="text" id="edit-tags" /></label>

          <label>Replace file (optional)<input type="file" id="edit-file" /></label>

          <div class="edit-modal-actions">
            <button type="submit" class="icon-btn primary">Save changes</button>
            <button type="button" class="icon-btn" data-close>Cancel</button>
            <p id="edit-error" class="error" hidden></p>
          </div>
        </form>
      </div>
    </div>

    <!-- ============================================================
         ADMIN VIEW (rendered only when role === 'admin')
         ============================================================ -->
    <section id="view-admin" class="view">
      <div class="admin-grid">
        <div class="admin-card">
          <h2>Upload document</h2>
          <form id="upload-form">
            <label>File<input type="file" id="upload-file" required /></label>
            <label>Title<input type="text" id="upload-title" required /></label>
            <label>Category
              <div class="cat-selector" id="upload-cat-selector">
                <button type="button" class="cat-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="cat-trigger-label">—</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="cat-dropdown" role="listbox" hidden>
                  <div class="cat-options"></div>
                  <div class="cat-add-row">
                    <button type="button" class="cat-add-btn">+ New category</button>
                    <input type="text" class="cat-add-input" placeholder="Category name" hidden />
                  </div>
                </div>
              </div>
              <input type="hidden" id="upload-category" value="" />
            </label>
            <label>Tags (comma-separated)<input type="text" id="upload-tags" /></label>
            <button type="submit">Upload</button>
            <p id="upload-error" class="error" hidden></p>
          </form>
        </div>

        <div class="admin-card">
          <h2>Users</h2>
          <form id="user-form">
            <label>Email<input type="email" id="user-email-input" required /></label>
            <label>Temp password (min 8 chars)<input type="text" id="user-password" required minlength="8" /></label>
            <label>Role
              <select id="user-role-select">
                <option value="viewer">Viewer</option>
                <option value="admin">Admin</option>
              </select>
            </label>
            <button type="submit">Create user</button>
            <p id="user-error" class="error" hidden></p>
          </form>
          <table class="results">
            <thead><tr><th>Email</th><th>Role</th><th>Created</th></tr></thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
