<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Document Search</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.runtime.js"></script>
</head>
<body class="auth-body">
  <!-- Two-step password recovery:
       1. request — collect email, send a magic-link via Supabase OTP
       2. newpass — collect new password, save, sign out, redirect to login
       If the user lands here via the email link, the URL hash contains
       the session tokens and the page jumps straight to step 2.
       The .reset-step blocks are hidden via the .hidden class; the
       JS toggles them based on the landing path. -->
  <main class="auth-card">
    <img class="auth-logo" src="images/waghete-logo.png" alt="Waghete" />
    <h1>Reset password</h1>
    <p class="muted" id="step-subtitle">Enter the email on your account.</p>

    <form id="reset-request-form" class="reset-step">
      <label for="reset-email">Email</label>
      <input id="reset-email" name="email" type="email" required autocomplete="username" />

      <div class="form-actions">
        <button type="submit" id="reset-request-submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Send recovery link
        </button>
      </div>
      <p id="reset-request-error" class="error" hidden></p>
      <p class="muted small">
        <a href="./login.html">← Back to sign in</a>
      </p>
    </form>

    <form id="reset-newpass-form" class="reset-step hidden" autocomplete="off">
      <label for="reset-new-password">New password (min 8 chars)</label>
      <input id="reset-new-password" name="new-password" type="password" required minlength="8" autocomplete="new-password" />

      <label for="reset-confirm-password">Confirm new password</label>
      <input id="reset-confirm-password" name="confirm-password" type="password" required minlength="8" autocomplete="new-password" />

      <div class="form-actions">
        <button type="submit" id="reset-newpass-submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Update password
        </button>
      </div>
      <p id="reset-newpass-error" class="error" hidden></p>
    </form>
  </main>

  <script type="module" src="js/reset-password.js"></script>
  <div id="toast-container" hidden></div>
</body>
</html>
